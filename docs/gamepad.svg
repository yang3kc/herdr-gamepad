<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 910" width="1600" height="910" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3d4653"/><stop offset=".55" stop-color="#2a323d"/>
    <stop offset="1" stop-color="#191f27"/>
  </linearGradient>
  <linearGradient id="ctrl" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#454f5d"/><stop offset="1" stop-color="#2b333e"/>
  </linearGradient>
  <linearGradient id="trig" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3c4552"/><stop offset="1" stop-color="#252d38"/>
  </linearGradient>
  <radialGradient id="sheen" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#6d7b8e" stop-opacity=".45"/>
    <stop offset="1" stop-color="#6d7b8e" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="cap" cx="0.4" cy="0.3" r="0.85">
    <stop offset="0" stop-color="#4e5866"/><stop offset="1" stop-color="#262e39"/>
  </radialGradient>
  <filter id="shadow" x="-30%" y="-40%" width="160%" height="200%">
    <feGaussianBlur stdDeviation="24"/>
  </filter>
  <style>
    .cap   { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:16px; font-weight:700; fill:#e6edf3; letter-spacing:.6px; text-anchor:middle; }
    .base  { font-size:18.5px; }
    .pre   { font-size:16.5px; fill:#d2a8ff; }
    .end   { text-anchor:end; }
    .h1    { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:30px; font-weight:700; fill:#e6edf3; letter-spacing:.5px; }
    .h2    { font-size:17px; fill:#8b949e; }
    .glyph { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:20px; font-weight:700; text-anchor:middle; }
    .lg    { font-size:16.5px; fill:#8b949e; }
    .note  { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:14px; fill:#6e7b8b; }
    .eng   { font-family:ui-monospace, SFMono-Regular, Menlo, monospace; font-size:12px; fill:#7c8896; text-anchor:middle; letter-spacing:.4px; }
  </style>
</defs>
