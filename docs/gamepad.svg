<text x="88" y="796" class="lg"><tspan fill="#d2a8ff">prefix layer</tspan> — hold or tap BACK first. It really is Herdr’s prefix mode, so Herdr shows it.</text>
<rect x="62" y="817" width="12" height="12" rx="3" fill="#ffa657"/>
<text x="88" y="828" class="lg"><tspan fill="#ffa657">synthetic input</tspan> — real key and wheel events, sent to whatever has focus. Needs Accessibility.</text>
<rect x="62" y="849" width="12" height="12" rx="3" fill="#e6edf3"/>
<text x="88" y="860" class="lg"><tspan fill="#e6edf3">Herdr action</tspan> — sent as your own keybinding for it, so rebinding Herdr follows along.</text>
<text x="1540" y="796" class="note end">guide is eaten by the macOS Game Overlay — left unbound</text>
<text x="1540" y="828" class="note end">profile = xbox360 · also fits Xbox One and 8BitDo in X mode</text>
<text x="1540" y="860" class="note end">herdr plugin action invoke gamepad.learn — name any button</text>
