#  ╭──────────────────────────────────────────────────────────────────────╮
#  │  herdr-gamepad — drive Herdr with a game controller                  │
#  ╰──────────────────────────────────────────────────────────────────────╯
#
#  Bindings live in two blocks, split by who is being talked to:
#
#      [herdr]   operations on Herdr      next_tab, zoom, jump to an agent
#      [input]   pretend to be a keyboard/mouse    arrow keys, enter, scroll
#
#  Both have the same shape, and it is the same shape as Herdr's own [keys]:
#
#      ~/.config/herdr/config.toml        this file
#      next_tab = "shift+right"           next_tab = "rb"
#
#  Everything in [herdr] is sent as YOUR keybinding for it, so the controller
#  behaves exactly like the keyboard. Rebind Herdr and this follows along —
#  nothing to update here.
#
#  Copy this file into place:
#      cp config/gamepad.toml "$(herdr plugin config-dir gamepad)/gamepad.toml"
#
#
#  ── Controller inputs ───────────────────────────────────────────────────
#
#      a  b  x  y                 face buttons (a = down, b = right,
#      lb  rb                     shoulders     x = left, y = up)
#      lt  rt                     analog triggers
#      back  start                little centre buttons
#      l3  r3                     stick clicks — many pads never send these
#      dpad_up  dpad_down  dpad_left  dpad_right
#                                 (a HID hat switch is decoded into these
#                                  by the plugin — no profile entry needed)
#      guide                      big middle button, often eaten by macOS
#      share                      Xbox Series Share / DualSense Create
#
#      left_up   left_down   left_left   left_right       sticks, per direction
#      right_up  right_down  right_left  right_right
#
#  These names match the W3C standard gamepad layout that browsers report,
#  so any online gamepad tester agrees with this file.
#
#  Which button is which on YOUR pad?
#      herdr plugin action invoke gamepad.learn    press anything, see its name
#      herdr plugin action invoke gamepad.setup    guided, writes your profile


[gamepad]
# Built-in translation table. Also fits Xbox One pads and 8BitDo in X mode.
profile = "xbox360"

# Pin to one controller when several are plugged in (see gamepad.status):
# vendor  = 0x045E
# product = 0x028E


# ── Your controller's translation table ─────────────────────────────────
#
#  Only needed when NOT using a built-in profile. Left is the raw HID usage
#  your hardware sends, right is a standard name. gamepad.setup writes it.
#
#  Note: many third-party pads declare l3/r3 but never send them. If a stick
#  click does nothing, that is the pad, not this plugin.
#
# [profile.buttons]
# 1 = "a"
# 2 = "b"
#
# [profile.axes]
# X  = "left_x"    # sticks rest centred, signed range
# Z  = "lt"        # triggers rest at one end, 0…255 (wired Xbox pads)
# Brake       = "lt"   # Bluetooth Xbox Series pads put the triggers on the
# Accelerator = "rt"   # HID Simulation page instead — use these names


[tuning]
deadzone          = 0.25   # how far a stick moves before it counts (0–1)
                           # raise it if things trigger on their own
trigger_threshold = 0.5    # how far lt/rt must be squeezed to count
repeat_delay_ms   = 400    # hold this long before auto-repeat starts
repeat_rate_ms    = 80     # then repeat this often
scroll_invert     = false  # flip scroll direction — depends on your macOS
                           # "natural scrolling" setting, so no right default
prefix_timeout_ms = 2000   # after TAPPING a prefix, how long it waits for the
                           # next button. 0 = no tapping, hold-only (see below)
prefix_notify     = false  # announce an armed prefix as a notification. Off:
                           # the prefix is Herdr's own now, so Herdr already
                           # shows the mode. This would be a second, less
                           # reliable copy — notifications are rate-limited and
                           # hidden for the focused tab. Turn on if you also
                           # want the pad's tap timeout spelled out


# ═══════════════════════════════════════════════════════════════════════
#  [herdr] — operations on Herdr
#
#      behaviour = "controller input"
#
#  Bind several inputs to one behaviour with a list, exactly like Herdr:
#      focus_pane_left = ["dpad_left", "left_left"]
#
#  Auto-repeat while held:
#      focus_pane_down = { input = "dpad_down", repeat = true }
#
#  A PREFIX LAYER — one button gives every other input a second meaning,
#  the way tmux's prefix key works:
#
#      split_vertical = { input = "x", hold = "lb" }   # lb THEN x
#
#  Despite the name, `hold` is reached two ways, and both are always live:
#
#      HOLD  keep lb down, press x
#      TAP   press and release lb on its own, then press x within
#            prefix_timeout_ms — no need to keep a finger on it
#
#  Tapping the armed prefix again backs out of it. Anything else you press
#  spends it, so a stray tap costs you one button, not a mode you are stuck
#  in. Set prefix_timeout_ms = 0 to switch tapping off and keep hold only.
#
#  THE LAYER *IS* HERDR'S PREFIX MODE. Pressing the pad's prefix button sends
#  your Herdr prefix (ctrl+a) for real, the moment your thumb lands — so Herdr
#  shows the mode exactly as it does from the keyboard, and the second press
#  is a plain key rather than a chord this plugin fakes.
#
#  The price: everything in the layer has to be a Herdr action YOU bound
#  through the prefix, e.g. `split_vertical = "prefix+b"` in config.toml.
#  Prefix mode eats the next key, so these cannot live here — each is refused
#  at startup with a message naming the binding:
#
#      an [input] keystroke     it would go to Herdr, not to your pane
#      a built-in (agent_*)     talks over the socket and sends no key at
#                               all, so the mode would stay open
#      a non-prefix binding     next_tab = "shift+right" — Herdr would eat
#                               the chord and match nothing
#
#  Put those in the base layer instead; that is what the base layer is for.
#
#  A button used as a prefix never does anything by itself — not on tap, not
#  on hold — so leave it out of the layers below.
#
#  This is better than using the guide button, which macOS intercepts for
#  its Game Overlay before any program can see it.
#
#  Uncomment anything you want — the full list of what Herdr can do is here.
# ═══════════════════════════════════════════════════════════════════════

[herdr]

# ── Agents ──────────────────────────────────────────────────────────────
next_agent             = "rt"
previous_agent         = "lt"
# focus_agent          = ""
# agents               = ""      # open the agent panel

goto                   = "y"     # session navigator (prefix+g)

# Not in Herdr — this plugin adds these. Inputs still free: guide,
# left_left, left_right, l3, r3 (l3/r3 do not work on many pads).
# agent_next_waiting   = ""      # jump to an agent that stopped for you
# agent_previous_waiting = ""
# agent_back           = ""      # return to the agent you came from
# agent_overview       = ""      # notification: how is everything doing
# agent_read           = ""      # notification: focused agent's last output
# agent_quit           = ""      # Escape, then /exit + Enter to the focused
#                                # agent's pane, over the socket
# tab_next             = ""      # socket-based cycling, for when the keybinding
# tab_previous         = ""      # route is unavailable (see README)
# workspace_next       = ""
# workspace_previous   = ""

# ── Tabs ────────────────────────────────────────────────────────────────
next_tab               = "rb"
previous_tab           = "lb"
# Same shoulder as next_tab, one layer up — the tab family stays on one button.
new_tab                = { input = "rb", hold = "back" }
# close_tab            = ""
# rename_tab           = ""
# switch_tab           = ""
# tabs                 = ""

# ── Workspaces ──────────────────────────────────────────────────────────
#
#  `back` is left unbound on purpose: it is the prefix. Hold it, or tap it
#  once, to give every other input a second meaning. A prefix button is
#  ignored as an action in its own right, so binding it here would do nothing.
#
next_workspace         = "start"
previous_workspace     = { input = "start", hold = "back" }
# new_workspace        = ""
# close_workspace      = ""
# rename_workspace     = ""
# switch_workspace     = ""
# workspace_picker     = ""
# workspaces           = ""
# navigate_workspace_up   = ""
# navigate_workspace_down = ""

# ── Panes ───────────────────────────────────────────────────────────────
focus_pane_left        = "dpad_left"
focus_pane_right       = "dpad_right"
focus_pane_up          = "dpad_up"
focus_pane_down        = "dpad_down"

# The prefix layer: hold or tap `back`, then press. Every one of these is a
# `prefix+…` binding in your own config.toml — nothing else may live here.
zoom                   = { input = "a", hold = "back" }
split_vertical         = { input = "b", hold = "back" }
split_horizontal       = { input = "y", hold = "back" }
# close_pane           = ""
# The one you reach for most, so it gets the free face button.
last_pane              = { input = "x", hold = "back" }
# cycle_pane_next      = ""
# cycle_pane_previous  = ""
# rename_pane          = ""
# resize_mode          = ""
# navigate_pane_up     = ""
# navigate_pane_down   = ""
# navigate_pane_left   = ""
# navigate_pane_right  = ""

# ── Worktrees ───────────────────────────────────────────────────────────
# new_worktree         = ""
# open_worktree        = ""
# remove_worktree      = ""

# ── Everything else ─────────────────────────────────────────────────────
toggle_sidebar         = { input = "lb", hold = "back" }
# detach               = ""
# The two panels you open least often live on the triggers: they are analog,
# so they take a deliberate squeeze past trigger_threshold to fire.
help                   = { input = "rt", hold = "back" }
settings               = { input = "lt", hold = "back" }
# reload_config        = ""
# edit_scrollback      = ""
# open_notification_target = ""
# remote_image_paste   = ""


# ═══════════════════════════════════════════════════════════════════════
#  [input] — pretend to be a keyboard or mouse
#
#  Nothing here goes through Herdr. These drive whatever program currently
#  has focus: menus, fzf, pagers, TUIs.
#
#  REQUIRES ACCESSIBILITY PERMISSION — macOS will not let any process
#  synthesise input without it:
#
#      System Settings → Privacy & Security → Accessibility
#
#  The prompt names the TERMINAL that started the daemon, not this plugin.
#  Approve that, then restart the daemon.
# ═══════════════════════════════════════════════════════════════════════

[input]

# Face buttons as the usual three. Positions: a = down, x = left, b = right.
return = "a"
escape = "x"
space  = "b"

# Right stick as arrow keys — navigate any TUI without the keyboard.
up    = { input = "right_up",    repeat = true }
down  = { input = "right_down",  repeat = true }
left  = { input = "right_left",  repeat = true }
right = { input = "right_right", repeat = true }

# Left stick scrolls. This posts a real mouse-wheel event, which is why it
# scrolls Herdr's scrollback — forwarding PageUp would only reach the program
# inside the pane and does nothing at a shell prompt.
scroll_up   = { input = "left_up",   repeat = true }
scroll_down = { input = "left_down", repeat = true }

# Any key or combination works:
# tab      = ""
# delete   = ""
# pageup   = ""
# pagedown = ""
# home     = ""
# end      = ""
# "ctrl+c" = ""
# "ctrl+d" = ""


# ═══════════════════════════════════════════════════════════════════════
#  ADVANCED
#
#  For what the one-liner form cannot express: raw socket methods with
#  parameters, or a second layer gated behind a held button.
#
#  Herdr has 85 socket methods — see docs/methods.md or:
#      herdr api schema --json
#
#  In params, "$focused" becomes the pane that currently has focus. Methods
#  like pane.send_keys REQUIRE a pane_id, which nobody can hardcode.
# ═══════════════════════════════════════════════════════════════════════

# Hold lb to reach a second layer, like tmux's prefix key:
#
# [[bind]]
# button = "x"
# hold   = "lb"
# method = "pane.split"
# params = { direction = "right", ratio = 0.5 }
